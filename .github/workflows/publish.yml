name: Publish

on:
  release:
    types: [ published ]

permissions: read-all

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Hash-pinned via Corepack (avoids Scorecard npmCommand / npm install -g).
      - name: Setup npm
        run: |
          corepack enable
          corepack prepare npm@11.19.0+sha512-SDd/hHg3KqHE5Ht2NHWxNYNtqCQ2pXAPLl6OtQhPyED5PHsRfrOtO199MZTIG2cQoQ1ZRI9t28shrD+2cr3AAw== --activate

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Attach SLSA provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          OUT="attestation.intoto.jsonl"
          ATTEST_URL="https://registry.npmjs.org/-/npm/v1/attestations/$(node -p "encodeURIComponent(require('./package.json').name)")@${VER}"

          echo "Waiting for npm attestations at ${ATTEST_URL}..."
          for i in $(seq 1 30); do
            if curl -fsSL "${ATTEST_URL}" -o attestations.json; then
              if jq -e '.attestations | length > 0' attestations.json >/dev/null; then
                break
              fi
            fi
            rm -f attestations.json
            sleep 5
          done

          if [ ! -f attestations.json ]; then
            echo "Timed out waiting for npm attestations"
            exit 1
          fi

          jq -c '.attestations[].bundle.dsseEnvelope' attestations.json > "${OUT}"

          if [ ! -s "${OUT}" ]; then
            echo "No DSSE envelopes found in attestations response"
            exit 1
          fi

          echo "Uploading ${OUT} to release ${TAG}"
          gh release upload "${TAG}" "${OUT}" --clobber
