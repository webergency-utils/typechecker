name: Publish

on:
  release:
    types: [ published ]

permissions: read-all

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Attach SLSA provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          OUT="attestation.intoto.jsonl"

          echo "Waiting for npm attestations for ${PKG}@${VER}..."
          URL=""
          for i in $(seq 1 30); do
            URL="$(npm view "${PKG}@${VER}" dist.attestations.url 2>/dev/null || true)"
            if [ -n "${URL}" ] && [ "${URL}" != "undefined" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "${URL}" ] || [ "${URL}" = "undefined" ]; then
            echo "Timed out waiting for npm attestations URL"
            exit 1
          fi

          echo "Fetching attestations from ${URL}"
          curl -fsSL "${URL}" \
            | jq -c '.attestations[].bundle.dsseEnvelope' \
            > "${OUT}"

          if [ ! -s "${OUT}" ]; then
            echo "No DSSE envelopes found in attestations response"
            exit 1
          fi

          echo "Uploading ${OUT} to release ${TAG}"
          gh release upload "${TAG}" "${OUT}" --clobber
