name: Fuzzing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 0'

permissions: read-all

jobs:
  fuzz:
    name: Jazzer.js Fuzzing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build fuzz bundle
        run: npm run build:fuzz

      - name: Run fuzzer
        run: npx jazzer fuzz/typechecker.cjs --sync -- -runs=10000 -max_total_time=300
